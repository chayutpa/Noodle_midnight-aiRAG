name: Keep Space Alive

on:
  schedule:
    # รันทุกวัน เวลา 00:00 UTC (ประมาณ 07:00 น. เวลาไทย)
    - cron: '0 0 * * *'
  # สามารถกดรันเองมือได้จากแท็บ Actions
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping Request
        run: |
          curl -I -s https://huggingface.co/spaces/Yut15346/NoodleMidnight